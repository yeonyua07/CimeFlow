# Example Nginx front door for a scaled CimeFlow deployment.
# Replace hostnames with your container, VM, or service names.
# When using this proxy, set TRUST_PROXY=true on relay instances.

upstream cime_flow_ui {
  server cime-flow-ui:3000;
}

upstream cime_flow_relay {
  # Keep the same channel path on the same relay instance.
  # This preserves the "one upstream ci.me connection per channel per relay"
  # property when multiple relay instances are running.
  hash $uri consistent;

  server cime-flow-relay-1:3001;
  server cime-flow-relay-2:3001;
  server cime-flow-relay-3:3001;
}

server {
  listen 80;
  server_name example.com;

  location /api/ws/ {
    proxy_pass http://cime_flow_relay;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /api/cime/ {
    proxy_pass http://cime_flow_relay;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/metrics {
    proxy_pass http://cime_flow_relay;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /metrics {
    # Prefer exposing this only to Prometheus or a private network.
    # allow 10.0.0.0/8;
    # deny all;
    proxy_pass http://cime_flow_relay;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/health {
    proxy_pass http://cime_flow_ui;
  }

  location = /api/ready {
    proxy_pass http://cime_flow_relay;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/drain {
    # Do not expose this publicly. Prefer internal access from deploy automation.
    # allow 10.0.0.0/8;
    # deny all;
    proxy_pass http://cime_flow_relay;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /relay/health {
    proxy_pass http://cime_flow_relay/api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://cime_flow_ui;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
